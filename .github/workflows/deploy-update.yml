name: Prepare Upstream Update

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-update-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      UPDATE_SOURCE_REPOSITORY: ${{ vars.UPDATE_SOURCE_REPOSITORY || 'hieunc229/mailflare' }}
      GH_TOKEN: ${{ secrets.MAILFLARE_UPDATE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MAILFLARE_UPDATE_TOKEN || github.token }}
      - name: Prepare review branch without changing the deployment branch
        id: update
        shell: bash
        run: |
          set -euo pipefail
          [[ "$UPDATE_SOURCE_REPOSITORY" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]] || exit 1
          git config user.name "mailflare-update"
          git config user.email "mailflare-update@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPDATE_SOURCE_REPOSITORY}.git"
          git fetch --no-tags upstream
          upstream_branch="$(git remote show upstream | sed -n 's/.*HEAD branch: //p')"
          test -n "$upstream_branch"
          upstream_ref="upstream/${upstream_branch}"
          if git merge-base --is-ancestor "$upstream_ref" HEAD; then
            echo "No upstream changes."
            exit 0
          fi
          review_branch="updates/upstream-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          bash scripts/prepare-upstream-update.sh "$upstream_ref" "$review_branch"
          git push origin "HEAD:refs/heads/${review_branch}"
          gh pr create --repo "$GITHUB_REPOSITORY" --base "$GITHUB_REF_NAME" --head "$review_branch" --draft \
            --title "Review upstream Mailflare update" \
            --body "Upstream changes merged into a review branch. Check customizations, run tests and builds, and review migrations before merging. The deployment branch has not been changed."
